steps:
  # Build container image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/finshield-backend:$COMMIT_SHA', '-f', 'infra/Dockerfile', '.']

  # Push container image to Container Registry / Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/finshield-backend:$COMMIT_SHA']

  # Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'finshield-backend'
      - '--image'
      - 'gcr.io/$PROJECT_ID/finshield-backend:$COMMIT_SHA'
      - '--region'
      - 'asia-south1'
      - '--platform'
      - 'managed'
      - '--no-allow-unauthenticated'
      - '--set-env-vars'
      - 'ENVIRONMENT=production,GEMINI_PRO_MODEL=gemini-2.5-pro,GEMINI_FLASH_MODEL=gemini-2.5-flash,LOCAL_FALLBACK=false'

images:
  - 'gcr.io/$PROJECT_ID/finshield-backend:$COMMIT_SHA'
