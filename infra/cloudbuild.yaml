steps:
  # 1. Build multi-stage container image with Google Maps build args securely passed from Secret Manager
  - name: 'gcr.io/cloud-builders/docker'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        docker build \
          --build-arg VITE_GOOGLE_MAPS_API_KEY="$$MAPS_KEY" \
          --build-arg VITE_GOOGLE_MAPS_MAP_ID="$$MAPS_ID" \
          -t asia-south1-docker.pkg.dev/$PROJECT_ID/drishti/drishti-app:$COMMIT_SHA \
          -t asia-south1-docker.pkg.dev/$PROJECT_ID/drishti/drishti-app:latest \
          -f infra/Dockerfile .
    secretEnv: ['MAPS_KEY', 'MAPS_ID']

  # 2. Push container images to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', '--all-tags', 'asia-south1-docker.pkg.dev/$PROJECT_ID/drishti/drishti-app']

  # 3. Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'drishti-app'
      - '--image'
      - 'asia-south1-docker.pkg.dev/$PROJECT_ID/drishti/drishti-app:$COMMIT_SHA'
      - '--region'
      - 'asia-south1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--service-account'
      - 'drishti-run@$PROJECT_ID.iam.gserviceaccount.com'
      - '--memory'
      - '2Gi'
      - '--cpu'
      - '2'
      - '--concurrency'
      - '20'
      - '--timeout'
      - '300'
      - '--min-instances'
      - '1'
      - '--max-instances'
      - '2'
      - '--cpu-boost'
      - '--no-cpu-throttling'
      - '--port'
      - '8080'
      - '--set-env-vars'
      - 'ENVIRONMENT=production,GCP_PROJECT=$PROJECT_ID,GOOGLE_CLOUD_PROJECT=$PROJECT_ID,GCP_REGION=asia-south1,GCS_BUCKET_NAME=finshield-claims-docs-$PROJECT_ID,BIGQUERY_DATASET=finshield,FIRESTORE_DATABASE=(default),DOCUMENTAI_PROCESSOR_ID=projects/848168056257/locations/us/processors/8cb7d125a43425e4,DOCUMENTAI_LOCATION=us,GEMINI_PRO_MODEL=gemini-3.5-flash,GEMINI_FLASH_MODEL=gemini-3.5-flash,REQUIRE_CLOUD_ON_STARTUP=true,RATE_LIMIT_ENABLED=true,ALLOW_DEV_TOKENS=true'
      - '--set-secrets'
      - 'FINSHIELD_PROVENANCE_KEY=finshield-provenance-signing-key:latest'
      - '--startup-probe'
      - 'timeoutSeconds=20,periodSeconds=20,failureThreshold=6,httpGet.path=/api/health,httpGet.port=8080'
      - '--liveness-probe'
      - 'timeoutSeconds=5,periodSeconds=15,failureThreshold=3,httpGet.path=/,httpGet.port=8080'

images:
  - 'asia-south1-docker.pkg.dev/$PROJECT_ID/drishti/drishti-app:$COMMIT_SHA'
  - 'asia-south1-docker.pkg.dev/$PROJECT_ID/drishti/drishti-app:latest'

availableSecrets:
  secretManager:
    - versionName: projects/$PROJECT_ID/secrets/drishti-maps-key/versions/latest
      env: 'MAPS_KEY'
    - versionName: projects/$PROJECT_ID/secrets/drishti-maps-map-id/versions/latest
      env: 'MAPS_ID'
