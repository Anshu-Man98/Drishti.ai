name: FinShield CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-tests:
    name: Backend Pytest Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt pytest

      - name: Run Pytest Suite
        env:
          PYTHONPATH: .
          REQUIRE_CLOUD_ON_STARTUP: "false"
          ALLOW_DEV_TOKENS: "true"
          GOOGLE_CLOUD_PROJECT: "finshield-dev"
          GCS_BUCKET_NAME: "finshield-claims-docs"
          FIRESTORE_DATABASE: "(default)"
          BIGQUERY_DATASET: "finshield"
          DOCUMENTAI_PROCESSOR_ID: "projects/finshield-dev/locations/us/processors/test-processor"
          FINSHIELD_PROVENANCE_KEY: "test-provenance-key-32-bytes-ok!"
        run: |
          pytest backend/tests -q

  frontend-build:
    name: Frontend Build Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci

      - name: Build frontend
        run: |
          cd frontend
          npm run build
